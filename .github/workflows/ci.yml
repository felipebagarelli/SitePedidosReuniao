name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type check
        run: docker compose run --rm test npx tsc --noEmit

      - name: Run tests
        run: docker compose run --rm test

      - name: Build production image
        run: docker build --target runtime -t pedidos:ci .